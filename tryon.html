<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Virtual Try-On | ClothSwap</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827"></head><body><nav><a class="brand" href="home.html">♻️ ClothSwap</a><span><a href="listings.html">Browse</a><a href="ai.html">AI Style</a><a href="tryon.html">AR Try-On</a><a href="payment.html">Payment</a></span></nav><main><section class="card"><h1>👗 Virtual Clothing Try-On</h1><p class="muted">Camera-based demo: allow camera access, then choose a garment overlay. This is a browser prototype; accurate body tracking requires a dedicated AR/vision SDK.</p><div class="tryon"><div class="camera"><video id="camera" autoplay playsinline></video><img id="overlay" class="overlay" src="images/floral-dress.svg" alt="Garment overlay"><div id="camMsg" class="notice">Camera is off.</div></div><div><label>Choose clothing<select id="garment" onchange="overlay.src=this.value"><option value="images/floral-dress.svg">Floral Dress</option><option value="images/black-party-dress.svg">Black Party Dress</option><option value="images/pink-summer-dress.svg">Pink Summer Dress</option><option value="images/denim-dress.svg">Denim Dress</option><option value="images/summer-maxi-dress.svg">Summer Maxi Dress</option><option value="images/casual-dress.svg">Casual Day Dress</option></select></label><button onclick="startCamera()">📷 Start Camera</button><button class="secondary" onclick="stopCamera()">Stop Camera</button></div></div></section></main><script>let stream;async function startCamera(){try{stream=await navigator.mediaDevices.getUserMedia({video:true});camera.srcObject=stream;camMsg.textContent='Camera active. Move into the frame to preview the selected garment.'}catch(e){camMsg.textContent='Camera permission was not granted. You can still preview the garment overlay.'}}function stopCamera(){if(stream)stream.getTracks().forEach(t=>t.stop());camera.srcObject=null;camMsg.textContent='Camera is off.'}</script></body></html>
