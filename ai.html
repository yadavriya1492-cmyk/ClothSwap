<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Fashion Recommendations | ClothSwap</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827"></head><body><nav><a class="brand" href="home.html">♻️ ClothSwap</a><span><a href="listings.html">Browse</a><a href="ai.html">AI Style</a><a href="tryon.html">AR Try-On</a><a href="payment.html">Payment</a></span></nav><main><section class="card"><h1>🤖 AI Fashion Recommendation</h1><p class="muted">Choose your preferences and ClothSwap's recommendation engine will match available listings.</p><div class="form-grid"><label>Style<select id="aiStyle"><option value="casual">Casual</option><option value="party">Party</option><option value="summer">Summer</option><option value="classic">Classic</option></select></label><label>Category<select id="aiType"><option value="all">All</option><option value="Dresses">Dresses</option><option value="Shirts">Shirts</option><option value="Jeans">Jeans</option><option value="Jackets">Jackets</option></select></label><label>Size<select id="aiSize"><option value="all">Any</option><option>S</option><option>M</option><option>L</option><option>30</option><option>32</option></select></label><label>Max value (₹)<input id="aiBudget" type="number" value="1500" min="100"></label></div><button onclick="recommend()">✨ Get Recommendations</button></section><section class="card"><h2>Recommended for you</h2><div id="recommendations" class="grid"></div></section></main><script src="app.js"></script><script>async function recommend(){await getListings();const style=aiStyle.value,type=aiType.value,size=aiSize.value,budget=Number(aiBudget.value||99999);let a=listings.map(x=>{let score=0,n=x.name.toLowerCase();if(type==='all'||x.type===type)score+=4;if(size==='all'||x.size===size)score+=3;if(x.value<=budget)score+=2;if(style==='party'&&x.type==='Dresses')score+=2;if(style==='summer'&&(/summer|maxi|dress/i.test(n)))score+=2;if(style==='casual'&&(/casual|shirt|jeans|hoodie/i.test(n)))score+=2;if(style==='classic'&&(/denim|shirt|jacket/i.test(n)))score+=1;return {...x,score}}).sort((a,b)=>b.score-a.score).slice(0,6);recommendations.innerHTML=a.map(x=>`<div class="item"><img src="${x.img}" alt="${x.name}"><span class="pill">AI Match ${Math.min(99,60+x.score*5)}%</span><h3>${x.name}</h3><p>${x.brand} • Size ${x.size}</p><p>₹${x.value} • ${x.location}</p><button onclick="location.href='item.html?id=${x.id}'">View Details</button></div>`).join('')||'<p>No recommendations found.</p>'}</script></body></html>
