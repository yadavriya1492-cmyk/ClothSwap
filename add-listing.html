<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClothSwap | Add Listing</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827"></head><body><nav><a class="brand" href="home.html">♻️ ClothSwap</a><a href="listings.html">Listings</a><a href="ai.html">AI Style</a><a href="tryon.html">AR Try-On</a><a href="payment.html">Payment</a></nav><main><div class="card"><h1>List Your Clothing</h1><p class="muted">Upload an item and make it available for exchange.</p><form onsubmit="addListing(event)"><div class="row"><input id="itemName" placeholder="Item name" required><select id="itemType"><option>Dresses</option><option>Shirts</option><option>Jeans</option><option>Jackets</option></select></div><div class="row"><input id="itemBrand" placeholder="Brand" required><input id="itemSize" placeholder="Size" required></div><div class="row"><select id="itemCondition"><option>Excellent</option><option>Very Good</option><option>Good</option></select><input id="itemValue" type="number" placeholder="Estimated swap value ₹" required></div><input id="itemLocation" placeholder="Location" required><label>Clothing photo</label><input id="photo" type="file" accept="image/*"><button>Add Listing</button></form></div></main><script src="app.js"></script></body></html>
