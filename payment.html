<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Online Payment | ClothSwap</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#111827"></head><body><nav><a class="brand" href="home.html">♻️ ClothSwap</a><span><a href="listings.html">Browse</a><a href="ai.html">AI Style</a><a href="tryon.html">AR Try-On</a><a href="payment.html">Payment</a></span></nav><main><section class="card"><h1>💳 Online Payment</h1><div class="notice">Demo payment flow for the internship prototype. No real money is charged. A production gateway such as Razorpay/Stripe would be connected here using its official checkout SDK and merchant keys.</div><form onsubmit="pay(event)"><div class="form-grid"><label>Amount (₹)<input id="amount" type="number" min="1" value="499" required></label><label>Payment method<select id="method"><option>UPI</option><option>Card</option><option>Net Banking</option></select></label><label>Customer name<input id="payer" required placeholder="Your name"></label><label>Email<input id="payerEmail" type="email" required placeholder="you@example.com"></label></div><button>Pay Securely (Demo)</button></form><div id="paymentResult"></div></section></main><script>async function pay(e){e.preventDefault();const r=await fetch('/api/payments',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({amount:Number(amount.value),method:method.value,name:payer.value,email:payerEmail.value})});const d=await r.json();paymentResult.innerHTML=`<div class="notice">✅ Demo payment ${d.status}. Transaction ID: <b>${d.transactionId}</b></div>`}</script></body></html>
